<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1a30" />
    <meta name="description" content="ARGUS — Examination Vigilance System" />
    <title>ARGUS — Examination Vigilance System</title>
    
    <!-- Google Fonts: Space Grotesk 700 (Brand/Wordmark only), Inter (UI Chrome), JetBrains Mono (Telemetry/Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

    <!-- Immediate theme initializer: Prevents flash of wrong theme and keeps html/body classList in sync -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('argus_theme');
          var isDark = saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CDN configured with ARGUS institutional vigilance design system -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              brand: ['"Space Grotesk"', 'sans-serif'],
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            colors: {
              navy: {
                DEFAULT: '#0f1a30',
                2: '#1a2c4e',
                3: '#1b2a4a',
                hairline: '#26395c',
                panel: '#111a30',
                'panel-border': '#1c2742',
              },
              canvas: '#eef0f4',
              card: '#ffffff',
              border: {
                DEFAULT: '#e0e4ea',
                strong: '#cfd6e0',
                hairline: '#26395c',
              },
              ink: {
                DEFAULT: '#17233a',
                muted: '#5d6b82',
                faint: '#8b95a8',
              },
              accent: {
                DEFAULT: '#2f5fb3',
                hover: '#244d96',
                light: 'rgba(47, 95, 179, 0.08)',
                border: 'rgba(47, 95, 179, 0.25)',
              },
              success: {
                DEFAULT: '#1f9d63',
                bg: 'rgba(31, 157, 99, 0.10)',
                border: 'rgba(31, 157, 99, 0.28)',
              },
              warn: {
                DEFAULT: '#b45309',
                bg: 'rgba(180, 83, 9, 0.10)',
                border: 'rgba(180, 83, 9, 0.28)',
              },
              critical: {
                DEFAULT: '#c0392b',
                bg: 'rgba(192, 57, 43, 0.10)',
                border: 'rgba(192, 57, 43, 0.28)',
              },
            },
            borderRadius: {
              sm: '8px',
              md: '10px',
              lg: '12px',
              full: '9999px',
            },
            boxShadow: {
              card: '0 1px 2px rgba(18,29,51,.06), 0 12px 32px rgba(18,29,51,.08)',
              floating: '0 16px 44px rgba(18,29,51,.22)',
            },
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f5f5f7] dark:bg-[#000000] text-[#1d1d1f] dark:text-[#f5f5f7] antialiased font-sans selection:bg-[#0071e3]/20 selection:text-current">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
