<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121011" />
    <meta name="description" content="ARGUS — Autonomous Real-Time Exam Surveillance & Forensic Invigilation Console" />
    <title>ARGUS — Institutional Exam Integrity Ledger</title>
    
    <!-- Google Fonts: Source Serif 4 (Display/Headings), Inter (UI Chrome), JetBrains Mono (Telemetry) with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />

    <!-- Tailwind CDN with ARGUS v2 Palette Extension -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              heading: ['"Source Serif 4"', 'Georgia', 'serif'],
              display: ['"Source Serif 4"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              canvas: '#121011',
              surface: '#1a1719',
              'surface-raised': '#221e20',
              'surface-sunken': '#0b0a0a',
              card: '#1a1719',
              'card-hover': '#221e20',
              elevated: '#221e20',
              border: 'rgba(244, 241, 235, 0.07)',
              'border-strong': 'rgba(244, 241, 235, 0.14)',
              hairline: 'rgba(244, 241, 235, 0.07)',
              'hairline-strong': 'rgba(244, 241, 235, 0.14)',
              accent: {
                DEFAULT: '#8a4a6b',
                hover: '#9b5579',
                text: '#b8789a',
                wash: 'rgba(138, 74, 107, 0.12)',
                border: 'rgba(138, 74, 107, 0.35)',
              },
              critical: '#c76454',
              high: '#c98a52',
              medium: '#c2ab5c',
              low: '#6b9ab5',
              good: '#6ba883',
            },
            borderRadius: {
              sm: '4px',
              md: '8px',
              lg: '8px',
            },
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#121011] text-[#f0ece4] antialiased font-sans selection:bg-[#8a4a6b]/30 selection:text-white">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
